                        <button class="btn btn-lg btn-danger" type="button" data-coreui-toggle="popover" title="" data-coreui-content="And here's some amazing content. It's very engaging. Right?" data-coreui-original-title="Popover title">Click to toggle popover</button>

                       <button class="btn btn-sm btn-warning float-end" type="button"

                                    data-coreui-placement="bottom" 
                                    data-coreui-content="<strong style='color: red;'>Application Status:</strong> <br><em>This is a fully formatted content block with <u>HTML styling</u>.</em>"

    <script>
                                        document.addEventListener('DOMContentLoaded', function () {
    const popoverTrigger = document.querySelector('[data-coreui-toggle="popover"]');
    if (popoverTrigger) {
        new coreui.Popover(popoverTrigger, {
            html: true, // Enable HTML content if needed
            placement: 'bottom' // Set placement if not default
        });
    }
});
                            </script>
